name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  # Aucun de ces travaux n'ecrit dans le depot : ils installent, lancent les tests, et
  # s'arretent la. Sans ce bloc, le jeton herite du DEFAUT du depot — invisible ici, et
  # qui redevient 'write' a une bascule d'organisation, un transfert ou un fork. Un
  # workflow doit porter ses droits, pas dependre d'un reglage qu'on ne voit pas en le
  # lisant. (CodeQL, 18/09/2026 : actions/missing-workflow-permissions)
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # app + core unit tests (import `app.*`, run from backend/)
      - name: Run app tests
        working-directory: backend
        run: python -m pytest tests/ -q

      # DSR / PBO statistics used by the research scripts (bare-module imports)
      - name: Run DSR/PBO tests
        working-directory: backend/scripts/p2
        run: python -m pytest -q test_dsr_pbo.py
