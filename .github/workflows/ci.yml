name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # app + core unit tests (import `app.*`, run from backend/)
      - name: Run app tests
        working-directory: backend
        run: python -m pytest tests/ -q

      # DSR / PBO statistics used by the research scripts (bare-module imports)
      - name: Run DSR/PBO tests
        working-directory: backend/scripts/p2
        run: python -m pytest -q test_dsr_pbo.py
